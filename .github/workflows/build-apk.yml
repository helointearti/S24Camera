name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 inclut déjà le SDK Android (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compiler l'APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: S24Camera-apk
          path: app/build/outputs/apk/release/*.apk

      # Publie l'APK dans « Releases » (lien de téléchargement direct)
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk S24Camera.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" S24Camera.apk --title "S24 Caméra $TAG" --notes "APK compilé automatiquement." --latest

permissions:
  contents: write
